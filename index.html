<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خیاطی</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--ac:#8c3b4a;--bd:#e7dfd4}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--tx:#f5efe8;--mu:#a8a29e;--ac:#e08a99;--bd:#44403c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif;max-width:720px;margin-inline:auto;padding:12px}
h3{margin:0 0 6px;font-size:16px}nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0}nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
button{cursor:pointer}button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{width:100%;margin:3px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.hero{background:linear-gradient(135deg,var(--ac),#c9788a);color:#fff;border-radius:18px;padding:18px;margin:8px 0}.hero h2{margin:0 0 4px;font-size:19px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{margin:0;text-align:center;padding:10px 4px}.n{font-size:19px;font-weight:700;color:var(--ac)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.qa button{padding:14px 8px;font-weight:700}
.mu{color:var(--mu);font-size:13px}.tag{background:var(--bd);border-radius:20px;padding:1px 10px;font-size:12px}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:6px;border-radius:6px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.chat{max-height:45vh;overflow-y:auto}.m{padding:6px 10px;border-radius:12px;margin:4px 0;background:var(--bd);max-width:85%}.m.me{background:var(--ac);color:#fff;margin-inline-start:auto}
</style></head><body>
<h2>✂️ خیاطی</h2><div id="app" class="mu">در حال بارگذاری…</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updatePassword,reauthenticateWithCredential,EmailAuthProvider}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,collection,getDoc,setDoc,updateDoc,deleteDoc,addDoc,writeBatch,onSnapshot,query,where,increment}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ⬇️ مقادیر پروژهٔ Firebase خودتان را از Project settings بگذارید
const CFG={apiKey:"AIzaSyAlu3Irz91hl5ff2kRPKZDFUVIpVk_rL2Q",authDomain:"khayatiterme.firebaseapp.com",projectId:"khayatiterme",storageBucket:"khayatiterme.firebasestorage.app",messagingSenderId:"236275558420",appId:"1:236275558420:web:2b61315dd553c08b7adf01"};

const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
const em=p=>p+"@khayati.app";
const ST=["جدید","برش","دوخت","پروف","آماده","تحویل شد"],ROLE={customer:"مشتری",tailor:"خیاط",admin:"مدیر"};
const TYPES=["کت","شلوار","مانتو","پیراهن","دامن","لباس مجلسی","اصلاح لباس","سایر"];
const MS=[["chest","دور سینه"],["waist","دور کمر"],["hip","دور باسن"],["shoulder","عرض شانه"],["sleeve","قد آستین"],["len","قد لباس"]];
const SFT=["خانه","سفارش‌ها","سفارش جدید","مشتری‌ها","حسابداری","دعوت‌ها","پشتیبانی"];
const T={customer:["خانه","سفارش‌های من","پشتیبانی"],tailor:SFT,admin:SFT};
let U=null,me=null,busy=false,tab=0,thread="",flash="",showPw=false,reg=false,arm="",meUnsub=null,dUnsubs=[];
let S={orders:[],track:[],users:[],msgs:[],ledger:[],invites:[],notifs:[]};
const fmt=n=>Number(n||0).toLocaleString("fa-IR");
const staff=()=>me&&me.role!=="customer",isAdmin=()=>me&&me.role==="admin";
const typing=()=>/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
const fl=()=>flash?`<div class="card" style="border-color:var(--ac)">${esc(flash)}</div>`:"";
const say=t=>{flash=t;render()};
const FE={"auth/invalid-credential":"شماره یا رمز اشتباه است","auth/email-already-in-use":"این شماره قبلاً ثبت شده","auth/weak-password":"رمز باید حداقل ۶ کاراکتر باشد","permission-denied":"دسترسی ندارید"};
const act=async(fn,ok)=>{try{await fn();flash=ok||""}catch(e){flash=FE[e.code]||e.message}render()};

function sub(name,q){dUnsubs.push(onSnapshot(q,s=>{S[name]=s.docs.map(d=>({id:d.id,...d.data()}));if(name==="msgs")S.msgs.sort((a,b)=>a.t-b.t);render()}))}
function start(){
  dUnsubs.forEach(f=>f());dUnsubs=[];const c=n=>collection(db,n);
  if(me.role==="customer"){sub("track",query(c("track"),where("cid","==",me.id)));sub("msgs",query(c("msgs"),where("tid","==",me.id)));sub("notifs",query(c("notifs"),where("uid","==",me.id)))}
  else{["orders","users","msgs","ledger","invites"].forEach(n=>sub(n,c(n)))}
}
onAuthStateChanged(auth,u=>{
  U=u;me=null;meUnsub&&meUnsub();dUnsubs.forEach(f=>f());dUnsubs=[];
  if(!u){render();return}
  meUnsub=onSnapshot(doc(db,"users",u.uid),s=>{
    const old=me&&me.role;me=s.exists()?{id:u.uid,...s.data()}:null;
    if(me&&me.role!==old)start();render();
  });
});
const ords=()=>[...(staff()?S.orders:S.track)].sort((a,b)=>b.t-a.t);

function authScr(){return `<div class="hero"><div style="font-size:42px">🧵</div><h2>به خیاطی خوش آمدید</h2><div>سفارش، اندازه‌گیری، چت و حسابداری در یک جا</div></div>
<div class="card"><h3>${reg?"ساخت حساب":"ورود"}</h3>${fl()}${reg?'<input id="an" placeholder="نام و نام خانوادگی">':""}
<input id="ap" inputmode="tel" placeholder="شمارهٔ موبایل"><input id="aw" type="password" placeholder="رمز (حداقل ۶ کاراکتر)">${reg?'<input id="ac" placeholder="کد دعوت (برای اولین کاربر لازم نیست)">':""}
<div class="row"><button class="p" onclick="auth_()">${reg?"ثبت‌نام":"ورود"}</button><button onclick="toggleReg()">${reg?"حساب دارم":"حساب ندارم"}</button></div></div>`}
async function auth_(){
  const phone=norm($("#ap").value),pw=$("#aw").value;
  if(phone.length<10)return say("شمارهٔ موبایل را درست وارد کنید");
  if(!reg){try{await signInWithEmailAndPassword(auth,em(phone),pw);flash=""}catch(e){say(FE[e.code]||e.message)}return}
  const name=$("#an").value.trim(),code=$("#ac").value.trim().toUpperCase();if(!name)return say("نام را وارد کنید");
  busy=true;render();let cred;
  try{
    cred=await createUserWithEmailAndPassword(auth,em(phone),pw);
    const first=!(await getDoc(doc(db,"config","bootstrap"))).exists(),b=writeBatch(db),uid=cred.user.uid;
    if(first){b.set(doc(db,"users",uid),{name,phone,role:"admin",t:Date.now()});b.set(doc(db,"config","bootstrap"),{by:uid})}
    else{
      const inv=await getDoc(doc(db,"invites",code||"-"));
      if(!inv.exists()||inv.data().used){await cred.user.delete();throw new Error("کد دعوت معتبر نیست")}
      b.set(doc(db,"users",uid),{name,phone,role:inv.data().role,inv:code,t:Date.now()});b.update(doc(db,"invites",code),{used:true,by:uid});
    }
    await b.commit();flash="";
  }catch(e){flash=FE[e.code]||e.message}
  busy=false;render();
}
function render(){
  if(typing()&&me)return;
  const A=$("#app");
  if(busy){A.textContent="در حال ساخت حساب…";return}
  if(!U){A.innerHTML=authScr();return}
  if(!me){A.innerHTML='<div class="card">حساب شما فعال نیست یا حذف شده. اگر تازه ثبت‌نام کرده‌اید چند لحظه صبر کنید.<br><button onclick="logout()">خروج</button></div>';return}
  const tabs=T[me.role];if(tab>=tabs.length)tab=0;const n=tabs[tab];
  let h=`<div class="row"><b>${esc(me.name)}</b><span class="tag">${ROLE[me.role]}</span><span><button onclick="togglePw()">🔑</button> <button onclick="logout()">خروج</button></span></div>${showPw?pwBox():""}${fl()}
<nav>${tabs.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="go(${i})">${t}</button>`).join("")}</nav>`;
  h+={"خانه":home,"سفارش جدید":newOrder,"سفارش‌های من":orders,"سفارش‌ها":orders,"پشتیبانی":chat,"مشتری‌ها":customers,"حسابداری":acct,"دعوت‌ها":invites}[n]();
  A.innerHTML=h;const c=$(".chat");if(c)c.scrollTop=c.scrollHeight;
}
const go=i=>{tab=i;flash="";render()},toggleReg=()=>{reg=!reg;flash="";render()},togglePw=()=>{showPw=!showPw;render()},logout=()=>signOut(auth);
const prog=s=>`<div class="bar"><i style="width:${(s+1)/ST.length*100}%"></i></div>`;
function pwBox(){return `<div class="card"><h3>تغییر رمز</h3><input id="pc" type="password" placeholder="رمز فعلی"><input id="pn" type="password" placeholder="رمز جدید (حداقل ۶ کاراکتر)">
<div class="row"><button class="p" onclick="setPw()">ذخیره</button><button onclick="togglePw()">بستن</button></div></div>`}
const setPw=()=>act(async()=>{await reauthenticateWithCredential(U,EmailAuthProvider.credential(U.email,$("#pc").value));await updatePassword(U,$("#pn").value);showPw=false},"رمز تغییر کرد ✅");

function sums(){let i=0,o=0;S.ledger.forEach(l=>l.type==="in"?i+=l.amount:o+=l.amount);return[i,o]}
function home(){
  const mine=ords(),live=mine.filter(o=>o.status<5),cust=!staff(),[inn,out]=sums(),n=s=>mine.filter(o=>o.status===s).length;
  const st=cust?[["🧵","در حال انجام",live.length],["🔔","آمادهٔ پروف",n(3)],["✅","آماده تحویل",n(4)]]
   :[["🧵","سفارش فعال",live.length],["🔔","پروف",n(3)],["💰","سود (تومان)",fmt(inn-out)]];
  const qa=cust?[["📋 سفارش‌های من",1],["💬 پشتیبانی",2]]:[["➕ سفارش جدید",2],["📋 سفارش‌ها",1],["📒 حسابداری",4],["👥 مشتری‌ها",3]];
  const notes=S.notifs.filter(x=>!x.read).map(x=>`<div class="card row" style="border-color:var(--ac)"><span>🔔 ${esc(x.text)}</span><button onclick="act(()=>updateDoc(doc(db,'notifs','${x.id}'),{read:true}))">باشه</button></div>`).join("");
  return `${notes}<div class="hero"><h2>سلام ${esc(me.name)} 👋</h2></div><div class="stats">${st.map(([i,l,v])=>`<div class="card"><div>${i}</div><div class="n">${v}</div><div class="mu">${l}</div></div>`).join("")}</div>
<div class="qa">${qa.map(([l,i],k)=>`<button class="${k?"":"p"}" onclick="go(${i})">${l}</button>`).join("")}</div>
<h3>آخرین سفارش‌ها</h3>${mine.slice(0,3).map(o=>`<div class="card"><div class="row"><b>${esc(o.type)}${cust?"":" – "+esc(o.cname)}</b><span class="tag">${ST[o.status]}</span></div>${prog(o.status)}</div>`).join("")||'<div class="card mu">هنوز سفارشی ثبت نشده.</div>'}`;
}
function newOrder(){return `<div class="card"><h3>ثبت سفارش و اندازه‌ها</h3><select id="oc" onchange="$('#on2').style.display=this.value?'none':'block'"><option value="">مشتری حضوری (بدون حساب)</option>${S.users.filter(u=>u.role==="customer").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><input id="on2" placeholder="نام مشتری">
<div class="g2"><select id="ot">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select><input id="of" placeholder="پارچه / رنگ"></div>
<div class="mu">اندازه‌ها (سانتی‌متر)</div><div class="g">${MS.map(([k,l])=>`<input id="m_${k}" type="number" inputmode="decimal" placeholder="${l}">`).join("")}</div>
<input id="od" placeholder="تاریخ تحویل"><textarea id="on" rows="2" placeholder="توضیحات و مدل دلخواه"></textarea><button class="p" onclick="addOrder()">ثبت سفارش</button></div>`}
const addOrder=()=>act(async()=>{
  const m={};MS.forEach(([k])=>m[k]=$("#m_"+k).value);const cid=$("#oc").value,u=S.users.find(x=>x.id===cid),cname=u?u.name:($("#on2").value.trim()||"مشتری");
  const r=doc(collection(db,"orders")),b=writeBatch(db),t=Date.now(),type=$("#ot").value,fabric=$("#of").value;
  b.set(r,{cid,cname,type,fabric,due:$("#od").value,notes:$("#on").value,m,status:0,price:0,paid:0,t});
  b.set(doc(db,"track",r.id),{cid,cname,type,fabric,status:0,t});await b.commit();tab=1;
},"سفارش ثبت شد ✅");
function orders(){
  const L=ords();if(!L.length)return '<div class="card mu">سفارشی وجود ندارد.</div>';
  if(!staff())return L.map(o=>`<div class="card"><div class="row"><b>${esc(o.type)}</b><span class="tag">${ST[o.status]}</span></div>${prog(o.status)}<div class="row mu">${ST.map((s,i)=>`<span style="${i===o.status?"color:var(--ac);font-weight:700":""}">${s}</span>`).join("")}</div>${o.status===3?'<div style="color:var(--ac)">🔔 لباس شما برای پروف آماده است؛ لطفاً به کارگاه مراجعه کنید.</div>':""}</div>`).join("");
  return L.map(o=>`<div class="card"><div class="row"><b>${esc(o.type)} – ${esc(o.cname)}</b><span class="tag">${ST[o.status]}</span></div>${prog(o.status)}
<div class="mu">${esc(o.fabric)} ${o.due?"· تحویل: "+esc(o.due):""}</div><div class="mu">${MS.filter(([k])=>o.m&&o.m[k]).map(([k,l])=>l+": "+esc(o.m[k])).join(" · ")}</div>${o.notes?`<div>${esc(o.notes)}</div>`:""}
<div class="mu">قیمت: ${fmt(o.price)} · پرداخت‌شده: ${fmt(o.paid)} · مانده: ${fmt(o.price-o.paid)} تومان</div>
<div class="g2"><select onchange="setSt('${o.id}',+this.value)">${ST.map((s,i)=>`<option value="${i}" ${i==o.status?"selected":""}>${s}</option>`).join("")}</select>
<input type="number" placeholder="قیمت (تومان)" value="${o.price||""}" onchange="act(()=>updateDoc(doc(db,'orders','${o.id}'),{price:+this.value}))"></div>
<div class="row"><input style="flex:1" id="pay_${o.id}" type="number" placeholder="مبلغ پرداخت جدید"><button onclick="pay('${o.id}')">ثبت پرداخت</button></div></div>`).join("");
}
const setSt=(id,v)=>act(async()=>{
  const o=S.orders.find(x=>x.id===id),b=writeBatch(db),t=Date.now();
  b.update(doc(db,"orders",id),{status:v});b.update(doc(db,"track",id),{status:v});
  if(v===3&&o.cid){const text=`لباس ${o.type} شما برای پروف آماده است؛ لطفاً به کارگاه مراجعه کنید.`;
    b.set(doc(collection(db,"notifs")),{uid:o.cid,text,read:false,t});b.set(doc(collection(db,"msgs")),{tid:o.cid,frm:me.id,name:"خیاطی",text,t})}
  await b.commit();
});
const pay=id=>act(async()=>{
  const a=+$("#pay_"+id).value,o=S.orders.find(x=>x.id===id);if(!(a>0))throw new Error("مبلغ نامعتبر");
  const b=writeBatch(db);b.update(doc(db,"orders",id),{paid:increment(a)});
  b.set(doc(collection(db,"ledger")),{type:"in",amount:a,descr:`پرداخت سفارش ${o.type} – ${o.cname}`,t:Date.now()});await b.commit();
});
function chat(){
  const tid=staff()?thread:me.id;let h="";
  if(staff())h+=`<select onchange="setThread(this.value)"><option value="">انتخاب مشتری…</option>${S.users.filter(u=>u.role==="customer").map(u=>`<option value="${u.id}" ${u.id==tid?"selected":""}>${esc(u.name)}</option>`).join("")}</select>`;
  if(!tid)return h+'<div class="card mu">یک مشتری را انتخاب کنید.</div>';
  return h+`<div class="card"><div class="chat">${S.msgs.filter(m=>m.tid==tid).map(m=>`<div class="m ${m.frm===me.id?"me":""}"><div class="mu" style="color:inherit;opacity:.7">${esc(m.name)}</div>${esc(m.text)}</div>`).join("")||'<span class="mu">هنوز پیامی نیست.</span>'}</div>
<div class="row"><input style="flex:1" id="mt" placeholder="پیام…" onkeydown="if(event.key==='Enter')send('${tid}')"><button class="p" onclick="send('${tid}')">ارسال</button></div></div>`}
const setThread=v=>{thread=v;render()};
const send=tid=>{const t=$("#mt").value.trim();if(t){$("#mt").value="";act(()=>addDoc(collection(db,"msgs"),{tid,frm:me.id,name:me.name,text:t,t:Date.now()}))}};

// ——— مشتری‌ها: خیاط و مدیر کاربر اضافه می‌کنند؛ فقط مدیر نقش را عوض می‌کند و حذف می‌کند ———
function customers(){
  const roles=isAdmin()?Object.entries(ROLE):[["customer","مشتری"]];
  return `<div class="card"><h3>افزودن کاربر</h3><input id="un" placeholder="نام"><input id="up" inputmode="tel" placeholder="شمارهٔ موبایل"><input id="uw" placeholder="رمز موقت (حداقل ۶ کاراکتر)">
<div class="row"><select id="ur" style="flex:1">${roles.map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button class="p" onclick="addUser()">افزودن</button></div></div>`
  +S.users.map(u=>`<div class="card"><div class="row"><div><b>${esc(u.name)}</b><div class="mu" dir="ltr">${esc(u.phone)}</div></div>
${isAdmin()&&u.id!==me.id?`<div><select onchange="act(()=>updateDoc(doc(db,'users','${u.id}'),{role:this.value}))">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${k===u.role?"selected":""}>${v}</option>`).join("")}</select> <button onclick="delU('${u.id}')">🗑</button></div>`:`<span class="tag">${ROLE[u.role]}</span>`}</div></div>`).join("");
}
const addUser=()=>act(async()=>{
  const name=$("#un").value.trim(),phone=norm($("#up").value),pw=$("#uw").value,role=$("#ur").value;
  if(!name||phone.length<10)throw new Error("نام و شمارهٔ موبایل را درست وارد کنید");
  const sec=initializeApp(CFG,"sec"+Date.now()),sa=getAuth(sec);
  try{const c=await createUserWithEmailAndPassword(sa,em(phone),pw);await setDoc(doc(db,"users",c.user.uid),{name,phone,role,t:Date.now()})}finally{await signOut(sa)}
},"کاربر اضافه شد ✅ (رمز موقت را به او بدهید تا عوض کند)");
const delU=id=>{if(arm!==id){arm=id;return say("برای حذف دوباره بزنید")}arm="";act(()=>deleteDoc(doc(db,"users",id)),"کاربر حذف شد")};

function acct(){const[inn,out]=sums(),due=S.orders.reduce((s,o)=>s+o.price-o.paid,0);
  return `<div class="g"><div class="card"><div class="mu">درآمد</div><b>${fmt(inn)}</b></div><div class="card"><div class="mu">هزینه</div><b>${fmt(out)}</b></div><div class="card"><div class="mu">سود</div><b>${fmt(inn-out)}</b></div></div>
<div class="card mu">طلب از مشتری‌ها: ${fmt(due)} تومان</div><div class="card"><h3>ثبت هزینه</h3><input id="ed" placeholder="شرح (پارچه، اجاره…)"><input id="ea" type="number" placeholder="مبلغ (تومان)"><button class="p" onclick="addExp()">ثبت</button></div>
${[...S.ledger].sort((a,b)=>b.t-a.t).map(l=>`<div class="card row"><span>${esc(l.descr)}</span><b style="color:${l.type==="in"?"#2e7d32":"#c62828"}">${l.type==="in"?"+":"−"}${fmt(l.amount)}</b></div>`).join("")}`}
