<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8c3b4a"><title>خیاطی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ec;--card:#fff;--tx:#241c1a;--mu:#85766f;--ac:#8c3b4a;--ac2:#c9788a;--bd:#eadfd6;--sh:0 4px 18px rgba(60,30,30,.08)}
:root[data-theme="dark"]{--bg:#151211;--card:#211c1b;--tx:#f4ece6;--mu:#a99d96;--ac:#e58a9b;--ac2:#b4506a;--bd:#3a3231;--sh:0 4px 18px rgba(0,0,0,.4)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151211;--card:#211c1b;--tx:#f4ece6;--mu:#a99d96;--ac:#e58a9b;--ac2:#b4506a;--bd:#3a3231;--sh:0 4px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.8 Vazirmatn,Tahoma,sans-serif;max-width:720px;margin-inline:auto;padding:0 12px 96px}
h3{margin:0 0 8px;font-size:16px;font-weight:800}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
button{cursor:pointer;transition:.15s}button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:600}
input,select,textarea{width:100%;margin:3px 0}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);border-color:transparent}
a{color:var(--ac);text-decoration:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top>div{flex:1;line-height:1.3}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.ic{padding:6px 10px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:22px;padding:20px;margin:6px 0 10px;box-shadow:var(--sh)}.hero h2{margin:0;font-size:20px}.hero div{opacity:.9;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0;text-align:center;padding:12px 6px}.stats .i{font-size:24px}.n{font-size:20px;font-weight:800;color:var(--ac)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.qa button{padding:14px 8px;font-weight:600;border-radius:16px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-block;border-radius:20px;padding:1px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0}.chips button{white-space:nowrap;padding:4px 12px;border-radius:20px;font-size:13px}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.steps{display:flex;margin:10px 0 4px}.st{flex:1;text-align:center;font-size:11px;color:var(--mu);position:relative}
.st b{display:block;width:22px;height:22px;margin:0 auto 2px;border-radius:50%;background:var(--bd);color:#fff;font-size:12px;line-height:22px}
.st.d b{background:var(--ac)}.st.c{color:var(--ac);font-weight:800}.st.c b{box-shadow:0 0 0 4px var(--bd)}
.bar{height:6px;border-radius:6px;background:var(--bd);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px}
.late{border-color:#dc2626!important}.latetag{color:#dc2626;font-weight:600;font-size:12px}
.chat{max-height:48vh;overflow-y:auto}.m{padding:7px 12px;border-radius:16px;margin:5px 0;background:var(--bd);max-width:85%}.m.me{background:var(--ac);color:#fff;margin-inline-start:auto}
.bot{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;gap:2px;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.bot button{flex:1;min-width:62px;border:0;background:none;padding:4px 2px;font-size:11px;color:var(--mu);line-height:1.3}.bot button span{display:block;font-size:20px}.bot button.on{color:var(--ac);font-weight:800}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:30px;box-shadow:var(--sh);max-width:90%;text-align:center}
.inv{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:16px}.inv .sheet{background:#fff;color:#111;max-width:560px;margin:auto;padding:20px;border-radius:12px;border:1px solid #ddd}
.inv table{width:100%;border-collapse:collapse}.inv td{padding:4px 0;border-bottom:1px dashed #ccc}
@media print{#app>*:not(.inv){display:none!important}.inv{position:static;padding:0}.inv .noprint{display:none}.inv .sheet{border:0}}
</style></head><body>
<div id="app" class="mu" style="padding-top:20px">در حال بارگذاری…</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updatePassword,reauthenticateWithCredential,EmailAuthProvider}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,collection,getDoc,setDoc,updateDoc,deleteDoc,addDoc,writeBatch,onSnapshot,query,where,increment}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CFG={apiKey:"AIzaSyAlu3Irz91hl5ff2kRPKZDFUVIpVk_rL2Q",authDomain:"khayatiterme.firebaseapp.com",projectId:"khayatiterme",storageBucket:"khayatiterme.firebasestorage.app",messagingSenderId:"236275558420",appId:"1:236275558420:web:2b61315dd553c08b7adf01"};
// بعد از ساخت Worker پیامک، آدرسش را اینجا بگذارید (مثلاً https://khayati-sms.xxx.workers.dev)
const SMS_URL="";
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
const em=p=>p+"@khayati.app";
const ST=["جدید","برش","دوخت","پروف","آماده","تحویل شد"],SC=["#6b7280","#d97706","#2563eb","#9333ea","#16a34a","#0f766e"],ROLE={customer:"مشتری",tailor:"خیاط",admin:"مدیر"};
const TYPES=["کت","شلوار","مانتو","پیراهن","دامن","لباس مجلسی","اصلاح لباس","سایر"],CATS=["پارچه و لوازم","اجاره","حقوق","حمل و نقل","سایر"];
const MS=[["chest","دور سینه"],["waist","دور کمر"],["hip","دور باسن"],["shoulder","عرض شانه"],["sleeve","قد آستین"],["len","قد لباس"]];
const IC={"خانه":"🏠","سفارش‌ها":"📋","سفارش‌های من":"📋","سفارش جدید":"➕","مشتری‌ها":"👥","حسابداری":"📒","دعوت‌ها":"🎟️","پشتیبانی":"💬"};
const SFT=["خانه","سفارش‌ها","سفارش جدید","مشتری‌ها","حسابداری","دعوت‌ها","پشتیبانی"];
const T={customer:["خانه","سفارش‌های من","پشتیبانی"],tailor:SFT,admin:SFT};
let U=null,me=null,busy=false,tab=0,thread="",flash="",showPw=false,reg=false,arm="",q="",fs=-1,invId="",meUnsub=null,dUnsubs=[],tt;
let S={orders:[],track:[],users:[],msgs:[],ledger:[],invites:[],notifs:[]};
const fmt=n=>Number(n||0).toLocaleString("fa-IR"),fd=t=>new Date(t).toLocaleDateString("fa-IR");
const isD=s=>/^\d{4}-\d\d-\d\d$/.test(s||""),fdue=s=>isD(s)?fd(s):(s||""),today=()=>new Date().toISOString().slice(0,10);
const late=o=>isD(o.due)&&o.due<today()&&o.status<4;
const staff=()=>me&&me.role!=="customer",isAdmin=()=>me&&me.role==="admin";
const typing=()=>/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
const chip=s=>`<span class="chip" style="background:${SC[s]}22;color:${SC[s]}">${ST[s]}</span>`;
const FE={"auth/invalid-credential":"شماره یا رمز اشتباه است","auth/email-already-in-use":"این شماره قبلاً ثبت شده","auth/weak-password":"رمز باید حداقل ۶ کاراکتر باشد","permission-denied":"دسترسی ندارید"};
const toast=t=>{flash=t;render();clearTimeout(tt);tt=setTimeout(()=>{flash="";$(".toast")?.remove()},3500)};
const fl=()=>flash?`<div class="toast">${esc(flash)}</div>`:"";
const act=async(fn,ok)=>{try{await fn();ok?toast(typeof ok==="function"?ok():ok):render()}catch(e){toast(FE[e.code]||e.message)}};
function sub(name,qq){dUnsubs.push(onSnapshot(qq,s=>{S[name]=s.docs.map(d=>({id:d.id,...d.data()}));if(name==="msgs")S.msgs.sort((a,b)=>a.t-b.t);render()}))}
function start(){
  dUnsubs.forEach(f=>f());dUnsubs=[];const c=n=>collection(db,n);
  if(me.role==="customer"){sub("track",query(c("track"),where("cid","==",me.id)));sub("msgs",query(c("msgs"),where("tid","==",me.id)));sub("notifs",query(c("notifs"),where("uid","==",me.id)))}
  else["orders","users","msgs","ledger","invites"].forEach(n=>sub(n,c(n)));
}
onAuthStateChanged(auth,u=>{
  U=u;me=null;meUnsub&&meUnsub();dUnsubs.forEach(f=>f());dUnsubs=[];
  if(!u){render();return}
  meUnsub=onSnapshot(doc(db,"users",u.uid),s=>{const old=me&&me.role;me=s.exists()?{id:u.uid,...s.data()}:null;if(me&&me.role!==old)start();render()});
});
const ords=()=>[...(staff()?S.orders:S.track)].sort((a,b)=>b.t-a.t);
const phOf=o=>(S.users.find(u=>u.id===o.cid)||{}).phone||o.ph||"";
const wa=p=>"https://wa.me/98"+p.replace(/^0/,"");

function authScr(){return `<div class="hero" style="margin-top:24px;text-align:center"><div style="font-size:48px">🧵</div><h2>خیاطی</h2><div>سفارش، اندازه‌گیری، چت و حسابداری در یک جا</div></div>
<div class="card"><h3>${reg?"ساخت حساب":"ورود"}</h3>${reg?'<input id="an" placeholder="نام و نام خانوادگی">':""}
<input id="ap" inputmode="tel" placeholder="شمارهٔ موبایل"><input id="aw" type="password" placeholder="رمز (حداقل ۶ کاراکتر)">${reg?'<input id="ac" placeholder="کد دعوت (برای اولین کاربر لازم نیست)">':""}
<div class="row" style="margin-top:8px"><button class="p" style="flex:1" onclick="auth_()">${reg?"ثبت‌نام":"ورود"}</button><button onclick="toggleReg()">${reg?"حساب دارم":"حساب ندارم"}</button></div></div>${fl()}`}
async function auth_(){
  const phone=norm($("#ap").value),pw=$("#aw").value;
  if(phone.length<10)return toast("شمارهٔ موبایل را درست وارد کنید");
  if(!reg){try{await signInWithEmailAndPassword(auth,em(phone),pw)}catch(e){toast(FE[e.code]||e.message)}return}
  const name=$("#an").value.trim(),code=$("#ac").value.trim().toUpperCase();if(!name)return toast("نام را وارد کنید");
  busy=true;render();let cred;
  try{
    cred=await createUserWithEmailAndPassword(auth,em(phone),pw);
    const first=!(await getDoc(doc(db,"config","bootstrap"))).exists(),b=writeBatch(db),uid=cred.user.uid;
    if(first){b.set(doc(db,"users",uid),{name,phone,role:"admin",t:Date.now()});b.set(doc(db,"config","bootstrap"),{by:uid})}
    else{
      const inv=await getDoc(doc(db,"invites",code||"-"));
      if(!inv.exists()||inv.data().used){await cred.user.delete();throw new Error("کد دعوت معتبر نیست")}
      b.set(doc(db,"users",uid),{name,phone,role:inv.data().role,inv:code,t:Date.now()});b.update(doc(db,"invites",code),{used:true,by:uid});
    }
    await b.commit();
  }catch(e){flash=FE[e.code]||e.message}
  busy=false;render();
}
function render(){
  if(typing()&&me)return;
  const A=$("#app");
  if(busy){A.textContent="در حال ساخت حساب…";return}
  if(!U){A.innerHTML=authScr();return}
  if(!me){A.innerHTML='<div class="card">حساب شما فعال نیست یا حذف شده. اگر تازه ثبت‌نام کرده‌اید چند لحظه صبر کنید.<br><br><button onclick="logout()">خروج</button></div>';return}
  const tabs=T[me.role];if(tab>=tabs.length)tab=0;const n=tabs[tab];
  const pages={"خانه":home,"سفارش جدید":newOrder,"سفارش‌های من":orders,"سفارش‌ها":orders,"پشتیبانی":chat,"مشتری‌ها":customers,"حسابداری":acct,"دعوت‌ها":invites};
  const unread=S.notifs.filter(x=>!x.read).length;
  A.innerHTML=`<div class="top"><div class="av">${esc(me.name[0]||"؟")}</div><div><b>${esc(me.name)}</b><div class="mu">${ROLE[me.role]}</div></div>
<button class="ic" onclick="togglePw()">🔑</button><button class="ic" onclick="toggleTheme()">🌓</button><button class="ic" onclick="logout()">⎋</button></div>
${showPw?pwBox():""}${pages[n]()}
<nav class="bot">${tabs.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="go(${i})"><span>${IC[t]}${t==="خانه"&&unread?"🔴":""}</span>${t}</button>`).join("")}</nav>${invId?invoice():""}${fl()}`;
  const c=$(".chat");if(c)c.scrollTop=c.scrollHeight;
}
const go=i=>{tab=i;render();scrollTo(0,0)},toggleReg=()=>{reg=!reg;render()},togglePw=()=>{showPw=!showPw;render()},logout=()=>signOut(auth);
const toggleTheme=()=>{const d=document.documentElement,c=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=c==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.th=n}catch(e){}};
try{if(localStorage.th)document.documentElement.dataset.theme=localStorage.th}catch(e){}
function pwBox(){return `<div class="card"><h3>تغییر رمز</h3><input id="pc" type="password" placeholder="رمز فعلی"><input id="pn" type="password" placeholder="رمز جدید (حداقل ۶ کاراکتر)">
<div class="row"><button class="p" onclick="setPw()">ذخیره</button><button onclick="togglePw()">بستن</button></div></div>`}
const setPw=()=>act(async()=>{await reauthenticateWithCredential(U,EmailAuthProvider.credential(U.email,$("#pc").value));await updatePassword(U,$("#pn").value);showPw=false},"رمز تغییر کرد ✅");
function sums(from=0){let i=0,o=0;S.ledger.forEach(l=>{if(l.t>=from)l.type==="in"?i+=l.amount:o+=l.amount});return[i,o]}
function steps(o){const h=o.hist||{};return `<div class="steps">${ST.map((s,i)=>`<div class="st ${i<=o.status?"d":""} ${i===o.status?"c":""}"><b>${i<o.status?"✓":i+1}</b>${s}${h[i]?`<div style="font-size:10px">${fd(h[i])}</div>`:""}</div>`).join("")}</div>`}
const prog=s=>`<div class="bar"><i style="width:${(s+1)/ST.length*100}%"></i></div>`;

function home(){
  const mine=ords(),live=mine.filter(o=>o.status<5),cust=!staff(),n=s=>mine.filter(o=>o.status===s).length;
  const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);const[inn]=sums(m0.getTime()),lateN=mine.filter(late).length;
  const st=cust?[["🧵","در حال انجام",live.length],["🔔","آمادهٔ پروف",n(3)]]
   :[["🧵","سفارش فعال",live.length],["🔔","در مرحلهٔ پروف",n(3)],["⏰","دیرکرد",lateN],["💰","درآمد این ماه",fmt(inn)]];
  const qa=cust?[["📋 سفارش‌های من",1],["💬 پشتیبانی",2]]:[["➕ سفارش جدید",2],["📋 سفارش‌ها",1],["📒 حسابداری",4],["👥 مشتری‌ها",3]];
  const notes=S.notifs.filter(x=>!x.read).map(x=>`<div class="card row" style="border-color:var(--ac)"><span>🔔 ${esc(x.text)}</span><button class="p" onclick="act(()=>updateDoc(doc(db,'notifs','${x.id}'),{read:true}))">باشه</button></div>`).join("");
  const soon=staff()?mine.filter(o=>isD(o.due)&&o.status<4).sort((a,b)=>a.due<b.due?-1:1).slice(0,4):[];
  return `${notes}<div class="hero"><h2>سلام ${esc(me.name)} 👋</h2><div>${new Date().toLocaleDateString("fa-IR",{weekday:"long",day:"numeric",month:"long"})}</div></div>
<div class="stats">${st.map(([i,l,v])=>`<div class="card"><div class="i">${i}</div><div class="n">${v}</div><div class="mu">${l}</div></div>`).join("")}</div>
<div class="qa">${qa.map(([l,i],k)=>`<button class="${k?"":"p"}" onclick="go(${i})">${l}</button>`).join("")}</div>
${soon.length?`<h3>⏳ تحویل‌های نزدیک</h3>${soon.map(o=>`<div class="card row ${late(o)?"late":""}"><span><b>${esc(o.type)}</b> – ${esc(o.cname)}</span><span class="mu">${fdue(o.due)} ${late(o)?'<span class="latetag">دیرکرد</span>':""}</span></div>`).join("")}`:""}
<h3>آخرین سفارش‌ها</h3>${mine.slice(0,3).map(o=>cust?ccard(o):`<div class="card"><div class="row"><b>${esc(o.type)} – ${esc(o.cname)}</b>${chip(o.status)}</div>${prog(o.status)}</div>`).join("")||'<div class="card mu" style="text-align:center">هنوز سفارشی ثبت نشده 🧵</div>'}`;
}
const ccard=o=>`<div class="card"><div class="row"><b>${esc(o.type)}</b>${chip(o.status)}</div><div class="mu">${esc(o.fabric)}</div>${steps(o)}${o.status===3?'<div style="color:var(--ac);font-weight:600">🔔 لباس شما برای پروف آماده است؛ لطفاً به کارگاه مراجعه کنید.</div>':""}</div>`;

function newOrder(){return `<div class="card"><h3>ثبت سفارش و اندازه‌ها</h3><select id="oc" onchange="$('#on2').style.display=$('#op').style.display=this.value?'none':'block'"><option value="">مشتری حضوری (بدون حساب)</option>${S.users.filter(u=>u.role==="customer").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select>
<input id="on2" placeholder="نام مشتری"><input id="op" inputmode="tel" placeholder="موبایل مشتری (اختیاری)">
<div class="g2"><select id="ot">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select><input id="of" placeholder="پارچه / رنگ"></div>
<div class="mu">اندازه‌ها (سانتی‌متر)</div><div class="g">${MS.map(([k,l])=>`<input id="m_${k}" type="number" inputmode="decimal" placeholder="${l}">`).join("")}</div>
<div class="mu">تاریخ تحویل</div><input id="od" type="date"><input id="opr" type="number" placeholder="قیمت (تومان، اختیاری)"><textarea id="on" rows="2" placeholder="توضیحات و مدل دلخواه"></textarea>
<button class="p" style="width:100%" onclick="addOrder()">ثبت سفارش</button></div>`}
const addOrder=()=>act(async()=>{
  const m={};MS.forEach(([k])=>m[k]=$("#m_"+k).value);const cid=$("#oc").value,u=S.users.find(x=>x.id===cid),cname=u?u.name:($("#on2").value.trim()||"مشتری"),ph=u?"":norm($("#op").value);
  const r=doc(collection(db,"orders")),b=writeBatch(db),t=Date.now(),type=$("#ot").value,fabric=$("#of").value,due=$("#od").value;
  b.set(r,{cid,cname,ph,type,fabric,due,notes:$("#on").value,m,status:0,price:+$("#opr").value||0,paid:0,t});
  b.set(doc(db,"track",r.id),{cid,cname,type,fabric,due,status:0,hist:{0:t},t});await b.commit();tab=1;
},"سفارش ثبت شد ✅");

const setQ=v=>{q=v;$("#ol").innerHTML=olist()},setFs=i=>{fs=i;render()};
function orders(){
  if(!staff())return ords().map(ccard).join("")||'<div class="card mu" style="text-align:center">سفارشی وجود ندارد.</div>';
  return `<input placeholder="🔍 جستجو (نام، لباس، پارچه)" value="${esc(q)}" oninput="setQ(this.value)"><div class="chips"><button class="${fs<0?"on":""}" onclick="setFs(-1)">همه</button>${ST.map((s,i)=>`<button class="${fs===i?"on":""}" onclick="setFs(${i})">${s}</button>`).join("")}</div><div id="ol">${olist()}</div>`;
}
function olist(){
  let L=ords();if(fs>=0)L=L.filter(o=>o.status===fs);const k=q.trim();if(k)L=L.filter(o=>(o.cname+" "+o.type+" "+o.fabric).includes(k));
  if(!L.length)return '<div class="card mu" style="text-align:center">سفارشی پیدا نشد.</div>';
  return L.map(o=>{const ph=phOf(o);return `<div class="card ${late(o)?"late":""}"><div class="row"><b>${esc(o.type)} – ${esc(o.cname)}</b>${chip(o.status)}</div>${prog(o.status)}
<div class="mu">${esc(o.fabric)} ${o.due?"· تحویل: "+fdue(o.due):""} ${late(o)?'<span class="latetag">دیرکرد</span>':""}</div><div class="mu">${MS.filter(([k])=>o.m&&o.m[k]).map(([k,l])=>l+": "+esc(o.m[k])).join(" · ")}</div>${o.notes?`<div>${esc(o.notes)}</div>`:""}
<div class="mu">قیمت: ${fmt(o.price)} · پرداخت‌شده: ${fmt(o.paid)} · مانده: <b>${fmt(o.price-o.paid)}</b> تومان</div>
<div class="g2" style="margin-top:6px"><select onchange="setSt('${o.id}',+this.value)">${ST.map((s,i)=>`<option value="${i}" ${i==o.status?"selected":""}>${s}</option>`).join("")}</select>
<input type="number" placeholder="قیمت (تومان)" value="${o.price||""}" onchange="act(()=>updateDoc(doc(db,'orders','${o.id}'),{price:+this.value}),'قیمت ذخیره شد')"></div>
<div class="row"><input style="flex:1" id="pay_${o.id}" type="number" placeholder="مبلغ پرداخت جدید"><button class="p" onclick="pay('${o.id}')">ثبت پرداخت</button></div>
<div class="row" style="margin-top:6px"><span><button onclick="openInv('${o.id}')">🧾 فاکتور</button> ${ph?`<a href="tel:${ph}"><button>📞</button></a> <a href="${wa(ph)}" target="_blank"><button>واتساپ</button></a>`:""}</span>${isAdmin()?`<button onclick="delOrder('${o.id}')">🗑</button>`:""}</div></div>`}).join("");
}
const setSt=(id,v)=>{let note="";return act(async()=>{
  const o=S.orders.find(x=>x.id===id),b=writeBatch(db),t=Date.now();
  b.update(doc(db,"orders",id),{status:v});b.update(doc(db,"track",id),{status:v,["hist."+v]:t});
  if(v===3&&o.cid){const text=`لباس ${o.type} شما برای پروف آماده است؛ لطفاً به کارگاه مراجعه کنید.`;
    b.set(doc(collection(db,"notifs")),{uid:o.cid,text,read:false,t});b.set(doc(collection(db,"msgs")),{tid:o.cid,frm:me.id,name:"خیاطی",text,t})}
  await b.commit();
  if(v===3&&SMS_URL&&(o.cid||o.ph)){
    try{const r=await fetch(SMS_URL,{method:"POST",headers:{Authorization:"Bearer "+await U.getIdToken(),"Content-Type":"application/json"},body:JSON.stringify({orderId:id})});
      note=r.ok?" و پیامک ارسال شد 📩":" ولی پیامک ارسال نشد";}catch(e){note=" ولی پیامک ارسال نشد"}
  }
},()=>"مرحله تغییر کرد"+note)};
const pay=id=>act(async()=>{
  const a=+$("#pay_"+id).value,o=S.orders.find(x=>x.id===id);if(!(a>0))throw new Error("مبلغ نامعتبر");
  const b=writeBatch(db);b.update(doc(db,"orders",id),{paid:increment(a)});
  b.set(doc(collection(db,"ledger")),{type:"in",amount:a,cat:"پرداخت مشتری",descr:`پرداخت سفارش ${o.type} – ${o.cname}`,t:Date.now()});await b.commit();
},"پرداخت ثبت شد ✅");
const delOrder=id=>{if(arm!==id){arm=id;return toast("برای حذف سفارش دوباره بزنید")}arm="";act(async()=>{const b=writeBatch(db);b.delete(doc(db,"orders",id));b.delete(doc(db,"track",id));await b.commit()},"سفارش حذف شد")};

// فاکتور قابل چاپ / ذخیره PDF
const openInv=id=>{invId=id;render()},closeInv=()=>{invId="";render()};
function invoice(){
  const o=S.orders.find(x=>x.id===invId);if(!o)return"";const r=(a,b)=>`<tr><td>${a}</td><td style="text-align:left">${b}</td></tr>`;
  return `<div class="inv"><div class="sheet"><h2 style="margin:0">✂️ فاکتور خیاطی</h2><div style="color:#666;font-size:13px">${fd(Date.now())}</div><hr>
<table>${r("مشتری",esc(o.cname))}${r("سفارش",esc(o.type))}${r("پارچه",esc(o.fabric))}${o.due?r("تاریخ تحویل",fdue(o.due)):""}
${MS.filter(([k])=>o.m&&o.m[k]).map(([k,l])=>r(l,esc(o.m[k])+" سانتی‌متر")).join("")}
${r("<b>مبلغ کل</b>","<b>"+fmt(o.price)+" تومان</b>")}${r("پرداخت‌شده",fmt(o.paid)+" تومان")}${r("<b>مانده</b>","<b>"+fmt(o.price-o.paid)+" تومان</b>")}</table>
<div class="noprint row" style="margin-top:16px"><button class="p" onclick="window.print()">🖨 چاپ / ذخیره PDF</button><button onclick="closeInv()">بستن</button></div></div></div>`;
}

function chat(){
  const tid=staff()?thread:me.id;let h="";
  if(staff())h+=`<select onchange="setThread(this.value)"><option value="">انتخاب مشتری…</option>${S.users.filter(u=>u.role==="customer").map(u=>`<option value="${u.id}" ${u.id==tid?"selected":""}>${esc(u.name)}</option>`).join("")}</select>`;
  if(!tid)return h+'<div class="card mu" style="text-align:center">یک مشتری را انتخاب کنید.</div>';
  return h+`<div class="card"><div class="chat">${S.msgs.filter(m=>m.tid==tid).map(m=>`<div class="m ${m.frm===me.id?"me":""}"><div style="font-size:11px;opacity:.7">${esc(m.name)} · ${new Date(m.t).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})}</div>${esc(m.text)}</div>`).join("")||'<span class="mu">هنوز پیامی نیست.</span>'}</div>
<div class="row" style="margin-top:8px"><input style="flex:1" id="mt" placeholder="پیام…" onkeydown="if(event.key==='Enter')send('${tid}')"><button class="p" onclick="send('${tid}')">ارسال</button></div></div>`}
const setThread=v=>{thread=v;render()};
const send=tid=>{const t=$("#mt").value.trim();if(t){$("#mt").value="";act(()=>addDoc(collection(db,"msgs"),{tid,frm:me.id,name:me.name,text:t,t:Date.now()}))}};

function customers(){
  const roles=isAdmin()?Object.entries(ROLE):[["customer","مشتری"]];
  return `<div class="card"><h3>افزودن کاربر</h3><input id="un" placeholder="نام"><input id="up" inputmode="tel" placeholder="شمارهٔ موبایل"><input id="uw" placeholder="رمز موقت (حداقل ۶ کاراکتر)">
<div class="row"><select id="ur" style="flex:1">${roles.map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button class="p" onclick="addUser()">افزودن</button></div></div>`
  +S.users.map(u=>`<div class="card"><div class="row"><div><b>${esc(u.name)}</b> <span class="mu">· ${S.orders.filter(o=>o.cid===u.id).length} سفارش</span><div class="mu" dir="ltr">${esc(u.phone)}</div></div>
<span><a href="tel:${esc(u.phone)}"><button>📞</button></a> <a href="${wa(u.phone)}" target="_blank"><button>واتساپ</button></a></span></div>
${isAdmin()&&u.id!==me.id?`<div class="row" style="margin-top:6px"><select style="flex:1" onchange="act(()=>updateDoc(doc(db,'users','${u.id}'),{role:this.value}),'نقش عوض شد')">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${k===u.role?"selected":""}>${v}</option>`).join("")}</select><button onclick="delU('${u.id}')">🗑</button></div>`:`<span class="chip" style="background:var(--bd)">${ROLE[u.role]}</span>`}</div>`).join("");
}
const addUser=()=>act(async()=>{
  const name=$("#un").value.trim(),phone=norm($("#up").value),pw=$("#uw").value,role=$("#ur").value;
  if(!name||phone.length<10)throw new Error("نام و شمارهٔ موبایل را درست وارد کنید");
  const sec=initializeApp(CFG,"sec"+Date.now()),sa=getAuth(sec);
  try{const c=await createUserWithEmailAndPassword(sa,em(phone),pw);await setDoc(doc(db,"users",c.user.uid),{name,phone,role,t:Date.now()})}finally{await signOut(sa)}
},"کاربر اضافه شد ✅ (رمز موقت را به او بدهید)");
const delU=id=>{if(arm!==id){arm=id;return toast("برای حذف دوباره بزنید")}arm="";act(()=>deleteDoc(doc(db,"users",id)),"کاربر حذف شد")};

function acct(){
  const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);const[mi,mo]=sums(m0.getTime()),[ti,to]=sums(),due=S.orders.reduce((s,o)=>s+o.price-o.paid,0);
  return `<div class="hero"><div>سود این ماه</div><h2>${fmt(mi-mo)} تومان</h2></div>
<div class="g"><div class="card"><div class="mu">درآمد ماه</div><b>${fmt(mi)}</b></div><div class="card"><div class="mu">هزینه ماه</div><b>${fmt(mo)}</b></div><div class="card"><div class="mu">طلب</div><b>${fmt(due)}</b></div></div>
<div class="card mu">کل: درآمد ${fmt(ti)} · هزینه ${fmt(to)} · سود ${fmt(ti-to)} تومان</div>
<div class="card"><h3>ثبت هزینه</h3><select id="ec">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="ed" placeholder="شرح"><input id="ea" type="number" placeholder="مبلغ (تومان)"><button class="p" style="width:100%" onclick="addExp()">ثبت</button></div>
<div class="row"><h3>تراکنش‌ها</h3><button onclick="exportCsv()">⬇️ خروجی اکسل</button></div>
${[...S.ledger].sort((a,b)=>b.t-a.t).map(l=>`<div class="card row"><span>${esc(l.descr)}<div class="mu">${fd(l.t)} ${l.cat?"· "+esc(l.cat):""}</div></span><b style="color:${l.type==="in"?"#16a34a":"#dc2626"}">${l.type==="in"?"+":"−"}${fmt(l.amount)}</b></div>`).join("")}`}
const addExp=()=>act(async()=>{const a=+$("#ea").value;if(!(a>0))throw new Error("مبلغ را وارد کنید");await addDoc(collection(db,"ledger"),{type:"out",amount:a,cat:$("#ec").value,descr:$("#ed").value||$("#ec").value,t:Date.now()})},"هزینه ثبت شد");
function exportCsv(){
  const rows=[["تاریخ","نوع","دسته","شرح","مبلغ"],...[...S.ledger].sort((a,b)=>a.t-b.t).map(l=>[new Date(l.t).toISOString().slice(0,10),l.type==="in"?"درآمد":"هزینه",l.cat||"",l.descr,l.amount])];
  const csv="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="hesabdari.csv";a.click();
}
function invites(){const roles=isAdmin()?Object.entries(ROLE):[["customer","مشتری"]];
  return `<div class="card"><h3>ساخت کد دعوت</h3><div class="row"><select id="ir" style="flex:1">${roles.map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button class="p" onclick="mk()">ساخت کد</button></div></div>
${[...S.invites].sort((a,b)=>b.t-a.t).map(i=>`<div class="card row"><b dir="ltr" style="font-size:18px;letter-spacing:2px">${i.id}</b><span class="mu">${ROLE[i.role]} · ${i.used?"استفاده‌شده":"آزاد"}</span></div>`).join("")}`}
const mk=()=>act(()=>{const c=Math.random().toString(36).slice(2,8).toUpperCase();return setDoc(doc(db,"invites",c),{role:$("#ir").value,used:false,t:Date.now()})},"کد ساخته شد");

Object.assign(window,{$,db,doc,updateDoc,act,auth_,toggleReg,togglePw,toggleTheme,logout,go,setPw,addOrder,setSt,pay,delOrder,openInv,closeInv,setQ,setFs,setThread,send,addUser,delU,addExp,exportCsv,mk});
render();
</script></body></html>
